name: Validate site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run likes:check
      - run: npm run build
        env:
          NEXT_PUBLIC_PHOTO_LIKES_API: ${{ vars.NEXT_PUBLIC_PHOTO_LIKES_API }}
